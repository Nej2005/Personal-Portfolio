  <!-- Instant Theme Loader Script -->
  <script>
    (function () {
      try {
        const saved = localStorage.getItem('portfolio_theme');
        const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
        if (saved === 'dark' || (!saved && prefersDark)) {
          document.documentElement.classList.add('dark');
        } else {
          document.documentElement.classList.remove('dark');
        }
      } catch (e) { }
    })();
  </script>
</head>

<body class="bg-white dark:bg-[#0D0D0D] text-portfolio-primary dark:text-[#EDEDED] antialiased selection:bg-neutral-200 selection:text-neutral-900 dark:selection:bg-neutral-800 dark:selection:text-white transition-colors duration-300">
